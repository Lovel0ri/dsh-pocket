<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="dsh-pocket 架构示意图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 15px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 13px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #334155; }
      .label { font: 600 13px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #475569; }
      .note { font: 14px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1100" height="600" fill="#f8fafc"/>
  <text x="550" y="52" text-anchor="middle" class="title">dsh-pocket 架构示意</text>
  <text x="550" y="78" text-anchor="middle" class="small">手机浏览器 → 本机 Python 服务 → ACP → DeepSeek Harness；历史存在本机 SQLite</text>

  <!-- Phone -->
  <rect x="40" y="150" width="220" height="190" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="190" text-anchor="middle" class="box-title">📱 手机浏览器</text>
  <text x="150" y="222" text-anchor="middle" class="text">同一 Wi-Fi</text>
  <text x="150" y="250" text-anchor="middle" class="small">打开电脑打印的地址</text>
  <text x="150" y="274" text-anchor="middle" class="mono">http://&lt;电脑IP&gt;:8766</text>
  <text x="150" y="310" text-anchor="middle" class="small">无登录 / 无配对码</text>

  <!-- Arrow phone -> service -->
  <line x1="260" y1="245" x2="322" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="291" y="232" text-anchor="middle" class="label">HTTP / WS</text>

  <!-- Service -->
  <rect x="330" y="130" width="350" height="230" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="505" y="170" text-anchor="middle" class="box-title">dsh-pocket 服务</text>
  <text x="505" y="200" text-anchor="middle" class="text">FastAPI + 手机静态页面</text>
  <text x="505" y="228" text-anchor="middle" class="text">REST + WebSocket</text>
  <text x="505" y="256" text-anchor="middle" class="small">工作区选择 / 会话列表 / 历史分页</text>
  <text x="505" y="280" text-anchor="middle" class="small">权限转发 / 停止 / 断线重连</text>
  <text x="505" y="318" text-anchor="middle" class="small">无鉴权 · 仅限可信局域网</text>

  <!-- Arrow service -> ACP -->
  <line x1="680" y1="245" x2="752" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="232" text-anchor="middle" class="label">ACP stdio</text>

  <!-- ACP / DSH -->
  <rect x="760" y="100" width="300" height="290" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="910" y="140" text-anchor="middle" class="box-title">ACP 子进程</text>
  <text x="910" y="170" text-anchor="middle" class="mono">dsh --profile acp</text>
  <text x="910" y="200" text-anchor="middle" class="small">stdio · JSON-RPC 2.0</text>
  <text x="910" y="226" text-anchor="middle" class="small">new / prompt / resume</text>
  <text x="910" y="250" text-anchor="middle" class="small">permission / cancel</text>
  <line x1="790" y1="270" x2="1030" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="910" y="300" text-anchor="middle" class="text">DeepSeek Harness</text>
  <text x="910" y="326" text-anchor="middle" class="small">凭据 ~/.dsh · 工作区注册表</text>
  <text x="910" y="350" text-anchor="middle" class="small">模型 API（DeepSeek）</text>
  <text x="910" y="374" text-anchor="middle" class="small">工具 / shell / 文件权限</text>

  <!-- SQLite -->
  <rect x="330" y="430" width="350" height="92" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="505" y="462" text-anchor="middle" class="box-title">SQLite 本地历史</text>
  <text x="505" y="488" text-anchor="middle" class="mono">~/.dsh-pocket/pocket.db</text>
  <text x="505" y="510" text-anchor="middle" class="small">手机创建的会话 / 消息 / 工具调用</text>

  <!-- Service -> SQLite dashed -->
  <line x1="505" y1="360" x2="505" y2="422" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="520" y="395" text-anchor="start" class="label">读写</text>

  <!-- Bottom note -->
  <text x="550" y="568" text-anchor="middle" class="note">手机端只显示自己创建的会话；桌面端历史暂不共享（以后可扩展）</text>
</svg>
